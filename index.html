<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIGITAL EXAM PORTAL</title>
  
  <!-- Bootstrap 5.3 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root {
      --primary-navy: #0d1b2a;
      --navy-light: #1b263b;
      --navy-accent: #415a77;
      --bg-body: #f1f5f9;
    }

    body {
      background-color: var(--bg-body);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-exam {
      width: 100%;
      max-width: 440px;
      border: 1px solid rgba(13, 27, 42, 0.08);
      border-radius: 1.25rem;
      background-color: #ffffff;
      box-shadow: 0 15px 35px -5px rgba(13, 27, 42, 0.15), 0 5px 15px rgba(0, 0, 0, 0.04);
      transition: max-width 0.35s ease-in-out;
    }

    /* Melebar otomatis saat ujian dimulai di layar tablet & laptop */
    .card-exam.ujian-mode {
      max-width: 950px;
    }

    .bg-navy {
      background-color: var(--primary-navy) !important;
    }

    .text-navy {
      color: var(--primary-navy) !important;
    }

    .btn-navy {
      background-color: var(--primary-navy);
      color: #ffffff;
      font-weight: 600;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 0.6rem;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-navy:hover:not(:disabled) {
      background-color: var(--navy-light);
      color: #ffffff;
    }

    .btn-navy:active:not(:disabled) {
      transform: scale(0.98);
    }

    .form-select:focus, .form-control:focus {
      border-color: var(--navy-accent);
      box-shadow: 0 0 0 0.25rem rgba(13, 27, 42, 0.15);
    }

    .exam-frame-container {
      width: 100%;
      height: 75vh;
      min-height: 520px;
      border-radius: 0.75rem;
      overflow: hidden;
      border: 1px solid #e2e8f0;
      background: #ffffff;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body class="p-3 p-md-4">

<div class="card card-exam" id="mainContainer">
  <div class="card-body p-4 p-md-5">

    <!-- Header Portal -->
    <div class="text-center mb-4">
      <div class="d-inline-flex p-3 rounded-circle bg-navy text-white mb-3 shadow-sm">
        <i class="bi bi-mortarboard-fill fs-3"></i>
      </div>
      <h3 class="fw-bold text-navy mb-1 fs-4 fs-md-3">DIGITAL EXAM PORTAL</h3>
      <p class="text-muted small mb-0">MTs Andalusia Banjarnegara</p>
    </div>

    <!-- Kotak Peringatan Pelanggaran -->
    <div id="peringatan" class="alert alert-danger d-none align-items-center gap-2 py-2 px-3 mb-4 rounded-3 border-danger-subtle" role="alert">
      <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
      <div class="small fw-semibold">
        Terdeteksi beralih aplikasi/tab! Pelanggaran dicatat ke sistem.
      </div>
    </div>

    <!-- Form Identitas (Login) -->
    <div id="identitasSection">
      <div class="mb-3">
        <label for="kelasSiswa" class="form-label fw-semibold text-navy small">
          <i class="bi bi-diagram-3-fill me-1"></i> Pilih Kelas
        </label>
        <select id="kelasSiswa" class="form-select py-2" onchange="filterNamaByKelas()" disabled>
          <option value="">Memuat data kelas...</option>
        </select>
      </div>

      <div class="mb-4">
        <label for="namaSiswa" class="form-label fw-semibold text-navy small">
          <i class="bi bi-person-fill me-1"></i> Pilih Nama Siswa
        </label>
        <select id="namaSiswa" class="form-select py-2" disabled>
          <option value="">Pilih kelas terlebih dahulu</option>
        </select>
      </div>

      <button id="btnMulai" onclick="mulaiUjian()" class="btn btn-navy w-100 d-flex justify-content-center align-items-center gap-2" disabled>
        <span>Mulai Ujian</span>
        <i class="bi bi-arrow-right-circle"></i>
      </button>
    </div>

    <!-- Section Ruang Ujian -->
    <div id="ujianSection" class="d-none">
      <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center bg-light p-3 rounded-3 border mb-3 gap-2">
        <div class="small text-navy">
          <i class="bi bi-person-badge-fill me-1"></i>
          <strong id="lblNama">-</strong> (<span id="lblKelas" class="text-muted">-</span>)
        </div>
        <div class="d-flex align-items-center gap-2 small">
          <span class="badge bg-success-subtle text-success border border-success-subtle px-2 py-1">
            <i class="bi bi-circle-fill fs-6 me-1"></i>Ujian Aktif
          </span>
          <span class="badge bg-danger-subtle text-danger border border-danger-subtle px-2 py-1">
            Pelanggaran: <strong id="counterPelanggaran">0</strong>x
          </span>
        </div>
      </div>

      <!-- Container Iframe Responsif -->
      <div class="exam-frame-container shadow-sm">
        <iframe src="https://bit.ly/exam91">Memuat form ujian...</iframe>
      </div>
    </div>

  </div>
</div>

<!-- Bootstrap 5.3 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzqeFzjp0DyxDQnhMzmaLGx7Z9f1NlUJrgG6xVVu3gSYflv1JdhozyXu5gAH5l2nF-z/exec";

  let listSiswa = [];
  let totalPelanggaran = 0;
  let ujianAktif = false;
  let dataSiswa = { nama: "", kelas: "" };

  window.addEventListener("DOMContentLoaded", async () => {
    const selectKelas = document.getElementById("kelasSiswa");
    const btnMulai = document.getElementById("btnMulai");

    try {
      const response = await fetch(SCRIPT_URL);
      const resData = await response.json();

      if (resData.status === "success" && resData.data.length > 0) {
        listSiswa = resData.data;

        const daftarKelas = [...new Set(listSiswa.map(item => item.kelas))].sort();

        selectKelas.innerHTML = '<option value="">-- Pilih Kelas --</option>';
        daftarKelas.forEach(kelas => {
          const opt = document.createElement("option");
          opt.value = kelas;
          opt.textContent = kelas;
          selectKelas.appendChild(opt);
        });

        selectKelas.disabled = false;
        btnMulai.disabled = false;
      } else {
        selectKelas.innerHTML = '<option value="">Data siswa kosong / tidak ditemukan</option>';
      }
    } catch (err) {
      console.error("Gagal memuat data dari Spreadsheet:", err);
      selectKelas.innerHTML = '<option value="">Gagal memuat data kelas</option>';
    }
  });

  function filterNamaByKelas() {
    const selectedKelas = document.getElementById("kelasSiswa").value;
    const selectNama = document.getElementById("namaSiswa");

    if (!selectedKelas) {
      selectNama.innerHTML = '<option value="">Pilih kelas terlebih dahulu</option>';
      selectNama.disabled = true;
      return;
    }

    const siswaTerfilter = listSiswa.filter(item => item.kelas === selectedKelas);
    siswaTerfilter.sort((a, b) => a.nama.localeCompare(b.nama));

    selectNama.innerHTML = '<option value="">-- Pilih Nama Anda --</option>';
    siswaTerfilter.forEach(item => {
      const opt = document.createElement("option");
      opt.value = item.nama;
      opt.textContent = item.nama;
      selectNama.appendChild(opt);
    });

    selectNama.disabled = false;
  }

  function mulaiUjian() {
    const nama = document.getElementById("namaSiswa").value;
    const kelas = document.getElementById("kelasSiswa").value;

    if (!kelas) {
      alert("Harap pilih Kelas terlebih dahulu!");
      return;
    }
    if (!nama) {
      alert("Harap pilih Nama Anda terlebih dahulu!");
      return;
    }

    dataSiswa.nama = nama;
    dataSiswa.kelas = kelas;
    ujianAktif = true;

    document.getElementById("lblNama").innerText = nama;
    document.getElementById("lblKelas").innerText = kelas;

    // Menyesuaikan layout menjadi mode ujian
    document.getElementById("mainContainer").classList.add("ujian-mode");
    document.getElementById("identitasSection").classList.add("d-none");
    document.getElementById("ujianSection").classList.remove("d-none");

    kirimLog("Mulai Ujian", 0);
  }

  document.addEventListener("visibilitychange", function() {
    if (!ujianAktif) return;

    if (document.hidden) {
      totalPelanggaran++;
      document.getElementById("counterPelanggaran").innerText = totalPelanggaran;
      
      const boxPeringatan = document.getElementById("peringatan");
      boxPeringatan.classList.remove("d-none");
      boxPeringatan.classList.add("d-flex");

      kirimLog("Pindah Tab / Minimize", totalPelanggaran);
    }
  });

  function kirimLog(aktivitas, count) {
    const payload = {
      nama: dataSiswa.nama,
      kelas: dataSiswa.kelas,
      aktivitas: aktivitas,
      totalPelanggaran: count
    };

    fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).catch(err => console.error("Gagal mengirim log:", err));
  }
</script>

</body>
</html>
