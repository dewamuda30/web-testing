<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - DIGITAL EXAM PORTAL</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root {
      --primary-navy: #0d1b2a;
      --navy-light: #1b263b;
      --navy-accent: #415a77;
      --bg-body: #f1f5f9;
    }

    body {
      background-color: var(--bg-body);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-login {
      width: 100%;
      max-width: 440px;
      border: 1px solid rgba(13, 27, 42, 0.08);
      border-radius: 1.25rem;
      background-color: #ffffff;
      box-shadow: 0 15px 35px -5px rgba(13, 27, 42, 0.15), 0 5px 15px rgba(0, 0, 0, 0.04);
    }

    .bg-navy {
      background-color: var(--primary-navy) !important;
    }

    .text-navy {
      color: var(--primary-navy) !important;
    }

    .btn-navy {
      background-color: var(--primary-navy);
      color: #ffffff;
      font-weight: 600;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 0.6rem;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-navy:hover:not(:disabled) {
      background-color: var(--navy-light);
      color: #ffffff;
    }

    .btn-navy:active:not(:disabled) {
      transform: scale(0.98);
    }

    .form-select:focus {
      border-color: var(--navy-accent);
      box-shadow: 0 0 0 0.25rem rgba(13, 27, 42, 0.15);
    }
  </style>
</head>
<body class="p-3 p-md-4">

<div class="card card-login">
  <div class="card-body p-4 p-md-5">

    <div class="text-center mb-4">
      <div class="d-inline-flex p-3 rounded-circle bg-navy text-white mb-3 shadow-sm">
        <i class="bi bi-mortarboard-fill fs-3"></i>
      </div>
      <h3 class="fw-bold text-navy mb-1 fs-4">DIGITAL EXAM PORTAL</h3>
      <p class="text-muted small mb-0">MTs Andalusia Banjarnegara</p>
    </div>

    <form id="formLogin" onsubmit="event.preventDefault(); mulaiUjian();">
      <div class="mb-3">
        <label for="kelasSiswa" class="form-label fw-semibold text-navy small">
          <i class="bi bi-diagram-3-fill me-1"></i> Pilih Kelas
        </label>
        <select id="kelasSiswa" class="form-select py-2" onchange="filterNamaByKelas()" disabled required>
          <option value="">Memuat data kelas...</option>
        </select>
      </div>

      <div class="mb-4">
        <label for="namaSiswa" class="form-label fw-semibold text-navy small">
          <i class="bi bi-person-fill me-1"></i> Pilih Nama Siswa
        </label>
        <select id="namaSiswa" class="form-select py-2" disabled required>
          <option value="">Pilih kelas terlebih dahulu</option>
        </select>
      </div>

      <button type="submit" id="btnMulai" class="btn btn-navy w-100 d-flex justify-content-center align-items-center gap-2" disabled>
        <span>Masuk ke Ruang Ujian</span>
        <i class="bi bi-arrow-right-circle"></i>
      </button>
    </form>

  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzqeFzjp0DyxDQnhMzmaLGx7Z9f1NlUJrgG6xVVu3gSYflv1JdhozyXu5gAH5l2nF-z/exec";

  let listSiswa = [];

  window.addEventListener("DOMContentLoaded", async () => {
    const selectKelas = document.getElementById("kelasSiswa");
    const btnMulai = document.getElementById("btnMulai");

    try {
      const response = await fetch(SCRIPT_URL);
      const resData = await response.json();

      if (resData.status === "success" && resData.data.length > 0) {
        listSiswa = resData.data;

        const daftarKelas = [...new Set(listSiswa.map(item => item.kelas))].sort();

        selectKelas.innerHTML = '<option value="">-- Pilih Kelas --</option>';
        daftarKelas.forEach(kelas => {
          const opt = document.createElement("option");
          opt.value = kelas;
          opt.textContent = kelas;
          selectKelas.appendChild(opt);
        });

        selectKelas.disabled = false;
        btnMulai.disabled = false;
      } else {
        selectKelas.innerHTML = '<option value="">Data siswa kosong / tidak ditemukan</option>';
      }
    } catch (err) {
      console.error("Gagal memuat data dari Spreadsheet:", err);
      selectKelas.innerHTML = '<option value="">Gagal memuat data kelas</option>';
    }
  });

  function filterNamaByKelas() {
    const selectedKelas = document.getElementById("kelasSiswa").value;
    const selectNama = document.getElementById("namaSiswa");

    if (!selectedKelas) {
      selectNama.innerHTML = '<option value="">Pilih kelas terlebih dahulu</option>';
      selectNama.disabled = true;
      return;
    }

    const siswaTerfilter = listSiswa.filter(item => item.kelas === selectedKelas);
    siswaTerfilter.sort((a, b) => a.nama.localeCompare(b.nama));

    selectNama.innerHTML = '<option value="">-- Pilih Nama Anda --</option>';
    siswaTerfilter.forEach(item => {
      const opt = document.createElement("option");
      opt.value = item.nama;
      opt.textContent = item.nama;
      selectNama.appendChild(opt);
    });

    selectNama.disabled = false;
  }

  function mulaiUjian() {
    const nama = document.getElementById("namaSiswa").value;
    const kelas = document.getElementById("kelasSiswa").value;

    if (!kelas || !nama) {
      alert("Harap pilih Kelas dan Nama Anda terlebih dahulu!");
      return;
    }

    // Simpan identitas dan inisialisasi counter pelanggaran ke 0
    sessionStorage.setItem("exam_nama", nama);
    sessionStorage.setItem("exam_kelas", kelas);
    sessionStorage.setItem("exam_pelanggaran", "0");
    sessionStorage.removeItem("exam_started"); // Reset flag mulai

    // Beralih ke halaman ujian
    window.location.href = "exam.html";
  }
</script>

</body>
</html>
