<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Ujian TIK - MTs Andalusia</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f4f6f8;
    }
    .container {
      max-width: 800px;
      margin: auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .warning-box {
      background-color: #ffebee;
      color: #c62828;
      border: 1px solid #ef9a9a;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
      display: none;
      font-weight: bold;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
      background-color: #fff;
    }
    select:disabled {
      background-color: #e9ecef;
      cursor: not-allowed;
    }
    button {
      background-color: #1976d2;
      color: white;
      padding: 10px 18px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }
    button:disabled {
      background-color: #9e9e9e;
      cursor: not-allowed;
    }
    iframe {
      width: 100%;
      height: 600px;
      border: 1px solid #ddd;
      border-radius: 6px;
      margin-top: 16px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Portal Ujian TIK - MTs Andalusia</h2>
  
  <div id="peringatan" class="warning-box">
    Peringatan: Anda terdeteksi meninggalkan layar ujian! Pelanggaran dicatat ke sistem guru.
  </div>

  <div id="identitasSection">
    <div class="form-group">
      <label for="kelasSiswa">Pilih Kelas:</label>
      <select id="kelasSiswa" onchange="filterNamaByKelas()" disabled>
        <option value="">Memuat data kelas...</option>
      </select>
    </div>

    <div class="form-group">
      <label for="namaSiswa">Pilih Nama Siswa:</label>
      <select id="namaSiswa" disabled>
        <option value="">Pilih kelas terlebih dahulu</option>
      </select>
    </div>

    <button id="btnMulai" onclick="mulaiUjian()" disabled>Mulai Ujian</button>
  </div>

  <div id="ujianSection" style="display: none;">
    <p>
      Siswa: <strong id="lblNama">-</strong> (<span id="lblKelas">-</span>) | 
      Status: <strong style="color: green;">Ujian Sedang Berlangsung</strong> | 
      Pelanggaran: <span id="counterPelanggaran">0</span>x
    </p>
    
    <iframe src="https://bit.ly/exam91">Memuat form ujian...</iframe>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzqeFzjp0DyxDQnhMzmaLGx7Z9f1NlUJrgG6xVVu3gSYflv1JdhozyXu5gAH5l2nF-z/exec";

  let listSiswa = [];
  let totalPelanggaran = 0;
  let ujianAktif = false;
  let dataSiswa = { nama: "", kelas: "" };

  // Ambil data siswa dari Sheet 'DD' saat halaman dimuat
  window.addEventListener("DOMContentLoaded", async () => {
    const selectKelas = document.getElementById("kelasSiswa");
    const btnMulai = document.getElementById("btnMulai");

    try {
      const response = await fetch(SCRIPT_URL);
      const resData = await response.json();

      if (resData.status === "success" && resData.data.length > 0) {
        listSiswa = resData.data;

        // Ambil daftar kelas unik dan urutkan
        const daftarKelas = [...new Set(listSiswa.map(item => item.kelas))].sort();

        selectKelas.innerHTML = '<option value="">-- Pilih Kelas --</option>';
        daftarKelas.forEach(kelas => {
          const opt = document.createElement("option");
          opt.value = kelas;
          opt.textContent = kelas;
          selectKelas.appendChild(opt);
        });

        selectKelas.disabled = false;
        btnMulai.disabled = false;
      } else {
        selectKelas.innerHTML = '<option value="">Data siswa kosong / tidak ditemukan</option>';
      }
    } catch (err) {
      console.error("Gagal memuat data dari Spreadsheet:", err);
      selectKelas.innerHTML = '<option value="">Gagal memuat data kelas</option>';
    }
  });

  // Filter nama siswa berdasarkan kelas yang dipilih
  function filterNamaByKelas() {
    const selectedKelas = document.getElementById("kelasSiswa").value;
    const selectNama = document.getElementById("namaSiswa");

    if (!selectedKelas) {
      selectNama.innerHTML = '<option value="">Pilih kelas terlebih dahulu</option>';
      selectNama.disabled = true;
      return;
    }

    // Filter siswa sesuai kelas
    const siswaTerfilter = listSiswa.filter(item => item.kelas === selectedKelas);
    
    // Urutkan nama secara alfabetis
    siswaTerfilter.sort((a, b) => a.nama.localeCompare(b.nama));

    selectNama.innerHTML = '<option value="">-- Pilih Nama Anda --</option>';
    siswaTerfilter.forEach(item => {
      const opt = document.createElement("option");
      opt.value = item.nama;
      opt.textContent = item.nama;
      selectNama.appendChild(opt);
    });

    selectNama.disabled = false;
  }

  function mulaiUjian() {
    const nama = document.getElementById("namaSiswa").value;
    const kelas = document.getElementById("kelasSiswa").value;

    if (!kelas) {
      alert("Harap pilih Kelas terlebih dahulu!");
      return;
    }
    if (!nama) {
      alert("Harap pilih Nama Anda terlebih dahulu!");
      return;
    }

    dataSiswa.nama = nama;
    dataSiswa.kelas = kelas;
    ujianAktif = true;

    document.getElementById("lblNama").innerText = nama;
    document.getElementById("lblKelas").innerText = kelas;

    document.getElementById("identitasSection").style.display = "none";
    document.getElementById("ujianSection").style.display = "block";

    // Kirim log awal saat siswa mulai ujian
    kirimLog("Mulai Ujian", 0);
  }

  // Deteksi beralih tab atau minimize browser
  document.addEventListener("visibilitychange", function() {
    if (!ujianAktif) return;

    if (document.hidden) {
      totalPelanggaran++;
      document.getElementById("counterPelanggaran").innerText = totalPelanggaran;
      
      const boxPeringatan = document.getElementById("peringatan");
      boxPeringatan.style.display = "block";

      kirimLog("Pindah Tab / Minimize", totalPelanggaran);
    }
  });

  function kirimLog(aktivitas, count) {
    const payload = {
      nama: dataSiswa.nama,
      kelas: dataSiswa.kelas,
      aktivitas: aktivitas,
      totalPelanggaran: count
    };

    fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).catch(err => console.error("Gagal mengirim log:", err));
  }
</script>

</body>
</html>
