<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIGITAL EXAM PORTAL</title>
  <style>
    :root {
      --primary-navy: #0d1b2a;
      --navy-light: #1b263b;
      --navy-accent: #415a77;
      --bg-color: #f0f4f8;
      --white: #ffffff;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: #334155;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 440px; /* Lebar pas untuk form login */
      background: var(--white);
      padding: 32px 28px;
      border-radius: 16px;
      box-shadow: 0 12px 35px -8px rgba(13, 27, 42, 0.18), 0 4px 12px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
      transition: max-width 0.3s ease;
    }

    /* Saat ujian berlangsung, kontainer melebar */
    .container.ujian-mode {
      max-width: 900px;
      padding: 24px;
    }

    .header-portal {
      text-align: center;
      margin-bottom: 24px;
    }

    .header-portal h2 {
      color: var(--primary-navy);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .header-portal p {
      color: var(--navy-accent);
      font-size: 13px;
      font-weight: 500;
    }

    .warning-box {
      background-color: var(--danger-bg);
      color: var(--danger);
      border: 1px solid #fecaca;
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 18px;
      display: none;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 13px;
      color: var(--navy-light);
    }

    input, select {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      font-size: 14px;
      color: var(--primary-navy);
      background-color: var(--white);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--primary-navy);
      box-shadow: 0 0 0 3px rgba(13, 27, 42, 0.12);
    }

    select:disabled {
      background-color: #f8fafc;
      color: #94a3b8;
      cursor: not-allowed;
    }

    button {
      width: 100%;
      background-color: var(--primary-navy);
      color: var(--white);
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
      transition: background-color 0.2s, transform 0.1s;
      margin-top: 6px;
    }

    button:hover:not(:disabled) {
      background-color: var(--navy-light);
    }

    button:active:not(:disabled) {
      transform: scale(0.99);
    }

    button:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      background-color: #f8fafc;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      font-size: 13px;
      color: var(--navy-light);
      margin-bottom: 14px;
    }

    .status-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      background-color: #dcfce7;
      color: #15803d;
      font-weight: 600;
    }

    .pelanggaran-badge {
      font-weight: bold;
      color: var(--danger);
    }

    iframe {
      width: 100%;
      height: 70vh;
      min-height: 550px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background: var(--white);
    }
  </style>
</head>
<body>

<div class="container" id="mainContainer">
  <div class="header-portal">
    <h2>DIGITAL EXAM PORTAL</h2>
    <p>MTs Andalusia Banjarnegara</p>
  </div>
  
  <div id="peringatan" class="warning-box">
    ⚠️ Peringatan: Terdeteksi meninggalkan layar ujian! Pelanggaran dicatat ke sistem.
  </div>

  <!-- Form Login Identitas -->
  <div id="identitasSection">
    <div class="form-group">
      <label for="kelasSiswa">Pilih Kelas</label>
      <select id="kelasSiswa" onchange="filterNamaByKelas()" disabled>
        <option value="">Memuat data kelas...</option>
      </select>
    </div>

    <div class="form-group">
      <label for="namaSiswa">Pilih Nama Siswa</label>
      <select id="namaSiswa" disabled>
        <option value="">Pilih kelas terlebih dahulu</option>
      </select>
    </div>

    <button id="btnMulai" onclick="mulaiUjian()" disabled>Mulai Ujian</button>
  </div>

  <!-- Section Ruang Ujian -->
  <div id="ujianSection" style="display: none;">
    <div class="status-bar">
      <div>
        Siswa: <strong id="lblNama">-</strong> (<span id="lblKelas">-</span>)
      </div>
      <div>
        Status: <span class="status-badge">Sedang Ujian</span> | 
        Pelanggaran: <span id="counterPelanggaran" class="pelanggaran-badge">0</span>x
      </div>
    </div>
    
    <iframe src="https://bit.ly/exam91">Memuat form ujian...</iframe>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzqeFzjp0DyxDQnhMzmaLGx7Z9f1NlUJrgG6xVVu3gSYflv1JdhozyXu5gAH5l2nF-z/exec";

  let listSiswa = [];
  let totalPelanggaran = 0;
  let ujianAktif = false;
  let dataSiswa = { nama: "", kelas: "" };

  // Ambil data siswa dari Sheet 'DD' saat halaman dimuat
  window.addEventListener("DOMContentLoaded", async () => {
    const selectKelas = document.getElementById("kelasSiswa");
    const btnMulai = document.getElementById("btnMulai");

    try {
      const response = await fetch(SCRIPT_URL);
      const resData = await response.json();

      if (resData.status === "success" && resData.data.length > 0) {
        listSiswa = resData.data;

        const daftarKelas = [...new Set(listSiswa.map(item => item.kelas))].sort();

        selectKelas.innerHTML = '<option value="">-- Pilih Kelas --</option>';
        daftarKelas.forEach(kelas => {
          const opt = document.createElement("option");
          opt.value = kelas;
          opt.textContent = kelas;
          selectKelas.appendChild(opt);
        });

        selectKelas.disabled = false;
        btnMulai.disabled = false;
      } else {
        selectKelas.innerHTML = '<option value="">Data siswa kosong / tidak ditemukan</option>';
      }
    } catch (err) {
      console.error("Gagal memuat data dari Spreadsheet:", err);
      selectKelas.innerHTML = '<option value="">Gagal memuat data kelas</option>';
    }
  });

  function filterNamaByKelas() {
    const selectedKelas = document.getElementById("kelasSiswa").value;
    const selectNama = document.getElementById("namaSiswa");

    if (!selectedKelas) {
      selectNama.innerHTML = '<option value="">Pilih kelas terlebih dahulu</option>';
      selectNama.disabled = true;
      return;
    }

    const siswaTerfilter = listSiswa.filter(item => item.kelas === selectedKelas);
    siswaTerfilter.sort((a, b) => a.nama.localeCompare(b.nama));

    selectNama.innerHTML = '<option value="">-- Pilih Nama Anda --</option>';
    siswaTerfilter.forEach(item => {
      const opt = document.createElement("option");
      opt.value = item.nama;
      opt.textContent = item.nama;
      selectNama.appendChild(opt);
    });

    selectNama.disabled = false;
  }

  function mulaiUjian() {
    const nama = document.getElementById("namaSiswa").value;
    const kelas = document.getElementById("kelasSiswa").value;

    if (!kelas) {
      alert("Harap pilih Kelas terlebih dahulu!");
      return;
    }
    if (!nama) {
      alert("Harap pilih Nama Anda terlebih dahulu!");
      return;
    }

    dataSiswa.nama = nama;
    dataSiswa.kelas = kelas;
    ujianAktif = true;

    document.getElementById("lblNama").innerText = nama;
    document.getElementById("lblKelas").innerText = kelas;

    // Ubah mode kontainer menjadi lebar untuk ujian
    document.getElementById("mainContainer").classList.add("ujian-mode");
    document.getElementById("identitasSection").style.display = "none";
    document.getElementById("ujianSection").style.display = "block";

    kirimLog("Mulai Ujian", 0);
  }

  document.addEventListener("visibilitychange", function() {
    if (!ujianAktif) return;

    if (document.hidden) {
      totalPelanggaran++;
      document.getElementById("counterPelanggaran").innerText = totalPelanggaran;
      
      const boxPeringatan = document.getElementById("peringatan");
      boxPeringatan.style.display = "block";

      kirimLog("Pindah Tab / Minimize", totalPelanggaran);
    }
  });

  function kirimLog(aktivitas, count) {
    const payload = {
      nama: dataSiswa.nama,
      kelas: dataSiswa.kelas,
      aktivitas: aktivitas,
      totalPelanggaran: count
    };

    fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).catch(err => console.error("Gagal mengirim log:", err));
  }
</script>

</body>
</html>
